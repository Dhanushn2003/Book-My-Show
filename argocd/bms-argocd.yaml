apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-my-show
  namespace: argocd
spec:
  project: default

  source:
    # GitHub Pages URL (Helm repository)
    repoURL: https://Dhanushn2003.github.io/Book-My-Show
    chart: bms-chart
    # Deploy latest released chart version
    targetRevision: "*"  # it will deploy the latest version of the chart available in the helm repository
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dhanush-ns 

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
