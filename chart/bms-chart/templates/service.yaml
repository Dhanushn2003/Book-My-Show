apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.metadata.name }}-service
  namespace: {{ .Values.metadata.namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Values.metadata.labels.app }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.container.port }}
