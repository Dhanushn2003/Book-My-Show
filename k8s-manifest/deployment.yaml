apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-app
  namespace: dhanush-ns
  labels:
    app: bms
spec:
  replicas: 4
  selector:
    matchLabels:
      app: bms
  template:
    metadata:
      labels:
        app: bms
    spec:
      containers:
      - name: bms-container
        image: dhanushn2003/book-my-show:latest
        ports:
        - containerPort: 3000  
